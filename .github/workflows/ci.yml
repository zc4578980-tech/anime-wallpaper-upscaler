name: Verify

on:
  push:
    branches:
      - main
      - codex/v0.2.0-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q anime_wallpaper_upscaler scripts tests

      - name: Check command-line help
        run: python scripts/upscale_wallpaper.py --help

      - name: Run PowerShell harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\powershell\setup.tests.ps1
          & .\tests\powershell\launcher.tests.ps1
